[project]
name = "flydream"
version = "0.0.1"
description = "What Does a Fly Dream Of? A connectome-constrained model of the fly visual system on MaleCNS."
requires-python = ">=3.12,<3.13"
dependencies = [
    "flyvis==1.2.0",
    "neuprint-python>=0.4",
    "pyarrow>=15",
    "pandas>=2.2",
    "numpy",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "modal>=1.5.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flydream"]
